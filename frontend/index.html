<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      try { document.documentElement.dataset.theme = localStorage.getItem('tripTheme') === 'dark' ? 'dark' : 'light' } catch { document.documentElement.dataset.theme = 'light' }
    </script>
    <style>html{background:#fff}html[data-theme="dark"]{background:#171717}</style>
    <title>旅途有方 · 智能旅行规划</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
